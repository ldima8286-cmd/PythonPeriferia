# Periferia configuration.
# Copy to ~/.config/periferia/config.yaml and edit.
# Show what is actually in effect with:  periferia config

audio:
  # Physical capture device. "auto" picks the first real (non virtual) source.
  # Run "periferia sources" to see the names.
  physical_source: auto

  # Name of the virtual source created from it. Applications should point here.
  virtual_name: PeriferiaMic

  # Attack and release in milliseconds. Attack must be short or the mic feels
  # late; release short enough not to cut the tail of a word.
  attack_ms: 10
  release_ms: 60

  # How long the mic stays open after the key is released, so the last word is
  # not clipped. Set 0 for a hard cut.
  hold_ms: 200

  # exp (default, fastest perceived onset), linear, s_curve
  curve: exp

  # Volume the mic opens to.
  target_volume: 1.0

  # Start with the mic closed. Keep this true.
  start_muted: true

  enabled: true

ptt:
  # Physical key to hold. "KEY_V" is the physical V key, which is "M" on a
  # Russian layout. Get the right value with:  periferia pick-key
  # Note: WASD is movement in most games, so avoid KEY_W KEY_A KEY_S KEY_D.
  ptt_key: auto

  # Instant mute, ignoring hold_ms. Set to "" to disable.
  panic_key: KEY_F12

  # Which keyboards to watch. "auto" watches every keyboard it can open, which
  # is what you want when you have a laptop keyboard plus an external one, so
  # the key works on both. To restrict it, give one node, or several comma
  # separated: "/dev/input/event4, /dev/input/event7". A stable name is better
  # than eventN, which can change after a reboot:
  #   ls /dev/input/by-id/
  device: auto
  #
  # ptt_key also accepts a mouse button, e.g. "BTN_SIDE" for a side button on a
  # gaming mouse. A mouse is only opened when the key is one of its buttons,
  # because reading one needs an extra udev rule that nobody should be granted
  # by default. Run "periferia pick-key" and press the button to get the name.

  # Ignore key auto-repeat. Keep true, otherwise the key sticks when held.
  ignore_repeat: true

  # Close the mic when the session locks. Keep true: walking away from the
  # desk while holding the key would otherwise leave the mic open in an empty
  # Cut off a key held longer than this, in ms. 0 disables. A last resort
  # against a press that never gets a matching release, since the key is not
  # grabbed and events can be lost. 300000 is five minutes.
  max_press_ms: 300000

  enabled: true

processing:
  # These are PipeWire module-echo-cancel properties, not code in this project.
  noise_suppression: true
  echo_cancellation: true
  # Voice activity detection. Cuts the signal between phrases, so quiet
  # speech can be lost. Turn it off if you would rather have the constant
  # noise floor than a clipped word.
  voice_detect: true
  tail_length_ms: 200

  # Anything else the module accepts.
  extra_props: {}

  enabled: true

log:
  level: info
  file: null

  enabled: true
