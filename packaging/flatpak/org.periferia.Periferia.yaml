id: org.periferia.Periferia
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: periferia-run

finish-args:
  # The daemon reads the keyboard with evdev and, for key remapping, writes
  # /dev/uinput. --device=all is the permission that brings both in; without it
  # push-to-talk sees no keys at all and only the config checker works.
  - --device=all
  - --share=ipc
  - --share=network
  # The virtual microphone and the PTT gate talk to the sound server. PipeWire
  # is the whole point; the Pulse socket is a fallback for client libraries.
  - --socket=pipewire
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  # The window reads and writes the config where the host daemon left it.
  - --filesystem=xdg-config/periferia:create
  # Per-window profiles ask the running KWin which window is focused.
  - --talk-name=org.kde.KWin

modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=/app --no-cache-dir "PyYAML>=6" "evdev>=2" "dbus-next>=0.2.3" "ruamel.yaml>=0.18" "PySide6>=6.6"
    build-options:
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_INPUT: "1"

  - name: periferia
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=/app --no-cache-dir .
    sources:
      - type: git
        url: https://github.com/ldima8286-cmd/PythonPeriferia
        branch: main

  - name: desktop-entries
    buildsystem: simple
    build-commands:
      - install -Dm755 periferia-run /app/bin/periferia-run
      - install -Dm644 org.periferia.Periferia.desktop /app/share/applications/org.periferia.Periferia.desktop
      - install -Dm644 org.periferia.Periferia.svg /app/share/icons/hicolor/scalable/apps/org.periferia.Periferia.svg
      - install -Dm644 org.periferia.Periferia.metainfo.xml /app/share/metainfo/org.periferia.Periferia.metainfo.xml
    sources:
      - type: file
        path: periferia-run
      - type: file
        path: org.periferia.Periferia.desktop
      - type: file
        path: org.periferia.Periferia.svg
      - type: file
        path: org.periferia.Periferia.metainfo.xml